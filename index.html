<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vis-Network Graph</title>
    <style>
      html, body {
          margin: 0;
          height: 100%;
          font-family: sans-serif;
          background-image: linear-gradient(
              76deg,
              #999999 16%, #989898 16%, #a9a9a9 33%,
              #a9a9a9 33%, #a9a9a9 50%, #999999 50%,
              #999999 66%, #989898 66%, #a9a9a9 83%,
              #a9a9a9 83%, #a9a9a9 100%);
          background-size: 61.84px 248.01px;        
      }
      #mynetwork {
          width: 100%;
          height: 100vh;
          border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <div id="mynetwork"></div>
    <script type="module" src="/src/main.js"></script>
    <div id="legend" style="
                            position: absolute;
                            top: 5px;
                            right: 5px;
                            background: rgba(200,200,200,0.5);
                            border: 1px solid #ccc;
                            border-radius: 10px;
                            padding: 8px 10px;
                            font-family: sans-serif;
                            font-size: 10px;
                            line-height: 0.2;
                            max-height: 95%;
                            overflow-y: auto;
                            z-index: 10;
                            ">
      <div style="font-weight:bold; margin-bottom:6px;">Filter by tag</div>
      <div id="legend-items"></div>
    </div>
    <div id="mynetwork" style="width:100%;height:100vh;"></div>
  </body>
</html>
